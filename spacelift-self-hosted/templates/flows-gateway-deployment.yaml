{{- if .Values.flows.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spacelift.fullname" . }}-flows-gateway
  labels:
    {{- include "spacelift.flowsLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.flows.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "spacelift.flowsSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      {{- with .Values.flows.gateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "spacelift.flowsSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      {{- with .Values.shared.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "spacelift.flowsServiceAccountName" . }}
      securityContext:
        {{- toYaml .Values.flows.gateway.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          securityContext:
            {{- toYaml .Values.flows.gateway.securityContext | nindent 12 }}
          image: "{{ include "spacelift.flowsImage" . }}"
          imagePullPolicy: {{ .Values.flows.pullPolicy }}
          command:
            - /usr/bin/spacelift-flows
          args:
            - gateway
          ports:
            - name: http
              containerPort: {{ .Values.flows.gateway.service.ports.http }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.flows.gateway.service.ports.grpc }}
              protocol: TCP
            - name: public
              containerPort: {{ .Values.flows.gateway.service.ports.public }}
              protocol: TCP
          env:
            - name: CONFIG_FILE
              value: /etc/flows/config.yaml
            {{- with .Values.flows.gateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/flows
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: public
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.flows.gateway.resources | nindent 12 }}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.flows.secretName }}
      {{- with .Values.flows.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.flows.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.flows.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
