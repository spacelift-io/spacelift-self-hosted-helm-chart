# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: deploy.enabled switch
templates:
  - deploy/drain/deployment.yaml
  - deploy/drain/pdb.yaml
  - deploy/drain/serviceaccount.yaml
  - deploy/server/mqtt-service.yaml
  - deploy/server/deployment.yaml
  - deploy/server/ingress-v6.yaml
  - deploy/server/ingress.yaml
  - deploy/server/pdb.yaml
  - deploy/server/serviceaccount.yaml
  - deploy/server/service.yaml
  - deploy/serviceaccount.yaml
  - deploy/vcs-gateway/deployment.yaml
  - deploy/vcs-gateway/gateway.yaml
  - deploy/vcs-gateway/httproute.yaml
  - deploy/vcs-gateway/ingress.yaml
  - deploy/vcs-gateway/pdb.yaml
  - deploy/vcs-gateway/service.yaml
  - deploy/vcs-gateway/serviceaccount.yaml
  - flows/server-deployment.yaml
  - validate.yaml
set:
  shared.launcherImage.enabled: true
tests:
  - it: deploys Spacelift by default
    asserts:
      - isKind:
          of: Deployment
        template: deploy/server/deployment.yaml
      - isKind:
          of: Deployment
        template: deploy/drain/deployment.yaml
      - isKind:
          of: Service
        template: deploy/server/service.yaml

  - it: renders nothing of Spacelift when deploy is disabled, whatever else is set
    set:
      deploy.enabled: false
      flows.enabled: true
      flows.domain: flows.example.com
      shared.launcherImage.enabled: false
      server.pdb.enabled: true
      server.pdb.minAvailable: 1
      server.serviceAccount.create: true
      drain.pdb.enabled: true
      drain.pdb.minAvailable: 1
      drain.serviceAccount.create: true
      vcsGateway.enabled: true
      vcsGateway.domain: vcs-gateway.example.com
      vcsGateway.serviceAccount.create: true
      vcsGateway.gateway.enabled: true
      vcsGateway.gateway.gatewayClassName: example-gateway-class
      vcsGateway.pdb.enabled: true
      vcsGateway.pdb.minAvailable: 1
    asserts:
      - hasDocuments:
          count: 0
        template: deploy/drain/deployment.yaml
      - hasDocuments:
          count: 0
        template: deploy/drain/pdb.yaml
      - hasDocuments:
          count: 0
        template: deploy/drain/serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: deploy/server/mqtt-service.yaml
      - hasDocuments:
          count: 0
        template: deploy/server/deployment.yaml
      - hasDocuments:
          count: 0
        template: deploy/server/ingress-v6.yaml
      - hasDocuments:
          count: 0
        template: deploy/server/ingress.yaml
      - hasDocuments:
          count: 0
        template: deploy/server/pdb.yaml
      - hasDocuments:
          count: 0
        template: deploy/server/serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: deploy/server/service.yaml
      - hasDocuments:
          count: 0
        template: deploy/serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: deploy/vcs-gateway/deployment.yaml
      - hasDocuments:
          count: 0
        template: deploy/vcs-gateway/gateway.yaml
      - hasDocuments:
          count: 0
        template: deploy/vcs-gateway/httproute.yaml
      - hasDocuments:
          count: 0
        template: deploy/vcs-gateway/ingress.yaml
      - hasDocuments:
          count: 0
        template: deploy/vcs-gateway/pdb.yaml
      - hasDocuments:
          count: 0
        template: deploy/vcs-gateway/service.yaml
      - hasDocuments:
          count: 0
        template: deploy/vcs-gateway/serviceaccount.yaml
      - isKind:
          of: Deployment
        template: flows/server-deployment.yaml

  - it: refuses to install nothing
    set:
      deploy.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: deploy.enabled and flows.enabled are both false, so the chart would install nothing
        template: validate.yaml
