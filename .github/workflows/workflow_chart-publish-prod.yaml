name: 🚀 Publish chart to production

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.ref }}-chart-publish-prod

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/job_chart-publish.yaml
    with:
      chart_version_strategy: tag

      r2_bucket: ${{ vars.R2_BUCKET }}
      r2_endpoint: ${{ vars.R2_ENDPOINT_URL }}

      cloudflare_zone_id: ${{ vars.EU_DOWNLOADS_CLOUDFLARE_ZONE_ID }}
      cloudflare_purge_prefix: downloads.spacelift.io/helm/

      smoke_pull_repo_url: https://downloads.spacelift.io/helm
    secrets:
      aws_region: ${{ secrets.AWS_REGION }}
      aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      aws_s3_bucket: ${{ secrets.AWS_S3_BUCKET }}
      cf_distribution_id: ${{ secrets.DISTRIBUTION }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      cloudflare_purge_token: ${{ secrets.EU_CLOUDFLARE_CACHE_PURGE_TOKEN }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          OCI_USERNAME: ${{ secrets.OCI_SPACELIFT_USERNAME }}
          OCI_PASSWORD: ${{ secrets.OCI_SPACELIFT_PASSWORD }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi

          VERSION="${TAG#v}"

          echo "$OCI_PASSWORD" | docker login oci.spacelift.io --username "$OCI_USERNAME" --password-stdin
          digest() {
            docker buildx imagetools inspect "oci.spacelift.io/deploy/$1:${TAG}" --format '{{.Manifest.Digest}}'
          }
          BACKEND_DIGEST="$(digest backend)"
          LAUNCHER_DIGEST="$(digest launcher)"
          BACKEND_REF="oci.spacelift.io/deploy/backend:${TAG}@${BACKEND_DIGEST}"
          LAUNCHER_REF="oci.spacelift.io/deploy/launcher:${TAG}@${LAUNCHER_DIGEST}"
          SIGNING_KEY="https://downloads.spacelift.io/oci/signing-key-v1.pub"

          cosign verify --key "$SIGNING_KEY" "$BACKEND_REF" >/dev/null
          cosign verify --key "$SIGNING_KEY" "$LAUNCHER_REF" >/dev/null
          docker logout oci.spacelift.io

          cat > notes.md <<NOTES
          ## 📦 New install

          \`\`\`sh
          helm repo add spacelift https://downloads.spacelift.io/helm
          helm repo update
          helm show values spacelift/spacelift-self-hosted --version ${VERSION} > values.yaml

          # Edit values.yaml for your environment
          helm install spacelift spacelift/spacelift-self-hosted --version ${VERSION} --values values.yaml
          \`\`\`

          ## ⬆️ Upgrade

          \`\`\`sh
          helm repo update
          helm upgrade spacelift spacelift/spacelift-self-hosted --version ${VERSION} --values values.yaml
          \`\`\`

          ## 🐳 New images

          | Component | Image |
          | --- | --- |
          | Backend | \`oci.spacelift.io/deploy/backend:${TAG}\` |
          | Launcher | \`oci.spacelift.io/deploy/launcher:${TAG}\` |

          <details>
          <summary>🔏 Verification</summary>

          #### Digests

          | Component | Digest |
          | --- | --- |
          | Backend | \`${BACKEND_DIGEST}\` |
          | Launcher | \`${LAUNCHER_DIGEST}\` |

          #### Signature

          \`\`\`sh
          cosign verify --key ${SIGNING_KEY} \\
            ${BACKEND_REF}

          cosign verify --key ${SIGNING_KEY} \\
            ${LAUNCHER_REF}
          \`\`\`

          #### SBOM

          \`\`\`sh
          docker buildx imagetools inspect \\
            ${BACKEND_REF} \\
            --format '{{json .SBOM}}'
          \`\`\`

          </details>

          NOTES

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file notes.md --generate-notes
