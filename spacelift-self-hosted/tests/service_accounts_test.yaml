# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: service account selection
templates:
  - deploy/serviceaccount.yaml
  - deploy/server/serviceaccount.yaml
  - deploy/drain/serviceaccount.yaml
  - deploy/vcs-gateway/serviceaccount.yaml
  - deploy/server/deployment.yaml
  - deploy/drain/deployment.yaml
  - deploy/vcs-gateway/deployment.yaml
set:
  shared.launcherImage.enabled: true
  vcsGateway.enabled: true
  vcsGateway.domain: vcs-gateway.example.com
tests:
  - it: uses the chart-managed shared service account by default
    asserts:
      - isKind:
          of: ServiceAccount
        template: deploy/serviceaccount.yaml
      - equal:
          path: metadata.name
          value: spacelift-backend
        template: deploy/serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: deploy/server/serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: deploy/drain/serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: deploy/vcs-gateway/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: spacelift-backend
        template: deploy/server/deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: spacelift-backend
        template: deploy/drain/deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: spacelift-backend
        template: deploy/vcs-gateway/deployment.yaml

  - it: uses an externally managed shared service account without creating it
    set:
      serviceAccount.create: false
      serviceAccount.name: existing-backend
    asserts:
      - hasDocuments:
          count: 0
        template: deploy/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-backend
        template: deploy/server/deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-backend
        template: deploy/drain/deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-backend
        template: deploy/vcs-gateway/deployment.yaml

  - it: creates and selects component-specific service accounts
    set:
      serviceAccount.create: false
      serviceAccount.name: existing-backend
      server.serviceAccount.create: true
      server.serviceAccount.name: custom-server
      drain.serviceAccount.create: true
      drain.serviceAccount.name: custom-drain
      vcsGateway.serviceAccount.create: true
      vcsGateway.serviceAccount.name: custom-vcs-gateway
    asserts:
      - equal:
          path: metadata.name
          value: custom-server
        template: deploy/server/serviceaccount.yaml
      - equal:
          path: metadata.name
          value: custom-drain
        template: deploy/drain/serviceaccount.yaml
      - equal:
          path: metadata.name
          value: custom-vcs-gateway
        template: deploy/vcs-gateway/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-server
        template: deploy/server/deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-drain
        template: deploy/drain/deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-vcs-gateway
        template: deploy/vcs-gateway/deployment.yaml
