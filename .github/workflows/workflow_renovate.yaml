name: 🤖 Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 9-16 * * 1-5'
      timezone: 'Europe/Warsaw'

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SELFHOSTED_CHART_APP_ID }}
          private-key: ${{ secrets.SELFHOSTED_CHART_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.13
        with:
          token: ${{ steps.generate_token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_SECRETS: >-
            {
              "OCI_SPACELIFT_USERNAME": ${{ toJSON(secrets.OCI_SPACELIFT_USERNAME) }},
              "OCI_SPACELIFT_PASSWORD": ${{ toJSON(secrets.OCI_SPACELIFT_PASSWORD) }}
            }
