# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: workload pod settings
templates:
  - server-deployment.yaml
  - drain-deployment.yaml
  - scheduler-deployment.yaml
  - vcs-gateway-deployment.yaml
set:
  shared.launcherImage.enabled: true
  scheduler.enabled: true
  vcsGateway.enabled: true
  vcsGateway.domain: vcs-gateway.example.com
tests:
  - it: sets pod annotations on every workload
    set:
      server.podAnnotations:
        example.com/component: server
      drain.podAnnotations:
        example.com/component: drain
      scheduler.podAnnotations:
        example.com/component: scheduler
      vcsGateway.podAnnotations:
        example.com/component: vcs-gateway
    asserts:
      - template: server-deployment.yaml
        equal:
          path: spec.template.metadata.annotations
          value:
            example.com/component: server
      - template: drain-deployment.yaml
        equal:
          path: spec.template.metadata.annotations
          value:
            example.com/component: drain
      - template: scheduler-deployment.yaml
        equal:
          path: spec.template.metadata.annotations
          value:
            example.com/component: scheduler
      - template: vcs-gateway-deployment.yaml
        equal:
          path: spec.template.metadata.annotations
          value:
            example.com/component: vcs-gateway

  - it: sets no pod annotations by default
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: sets terminationGracePeriodSeconds on every workload
    set:
      server.terminationGracePeriodSeconds: 120
      drain.terminationGracePeriodSeconds: 300
      scheduler.terminationGracePeriodSeconds: 60
      vcsGateway.terminationGracePeriodSeconds: 90
    asserts:
      - template: server-deployment.yaml
        equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
      - template: drain-deployment.yaml
        equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 300
      - template: scheduler-deployment.yaml
        equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
      - template: vcs-gateway-deployment.yaml
        equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 90

  - it: leaves terminationGracePeriodSeconds to Kubernetes by default
    asserts:
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds

  - it: rejects a terminationGracePeriodSeconds that is not a number
    template: server-deployment.yaml
    set:
      server.terminationGracePeriodSeconds: "30s"
    asserts:
      - failedTemplate:
          errorPattern: "/server/terminationGracePeriodSeconds': got string, want"
