{{- if and .Values.flows.enabled .Values.flows.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spacelift.flowsServiceAccountName" . }}
  labels:
    {{- include "spacelift.flowsLabels" . | nindent 4 }}
  {{- with .Values.flows.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
