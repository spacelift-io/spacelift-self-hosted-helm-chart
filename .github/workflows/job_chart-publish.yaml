name: Chart publish (reusable)

on:
  workflow_call:
    inputs:
      chart_version_strategy:
        description: "How to derive CHART_VERSION: 'timestamp' or 'tag'."
        type: string
        required: true
      chart_version_prefix:
        description: "Prefix used when chart_version_strategy=timestamp, e.g. 0.0.1-preprod."
        type: string
        default: ""

      r2_bucket:
        type: string
        required: true
      r2_endpoint:
        type: string
        required: true

      cloudflare_zone_id:
        type: string
        required: true
      cloudflare_purge_prefix:
        type: string
        required: true

      smoke_pull_repo_url:
        description: "Helm repo URL used by the smoke pull job, e.g. https://downloads.spacelift.io/helm."
        type: string
        required: true

    secrets:
      # These four are stored as repo *secrets* today but are not actually
      # sensitive (region, bucket name, role ARN, CloudFront distribution id).
      aws_region:
        required: true
      aws_role_to_assume:
        required: true
      aws_s3_bucket:
        required: true
      cf_distribution_id:
        required: true

      r2_access_key_id:
        required: true
      r2_secret_access_key:
        required: true
      cloudflare_purge_token:
        required: true

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "3.22.1"
  CHART: spacelift-self-hosted

jobs:
  registry:
    name: Publish the chart to the Helm repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      chart_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Helm S3 Plugin
        run: helm plugin install https://github.com/hypnoglow/helm-s3.git

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.aws_region }}
          role-to-assume: ${{ secrets.aws_role_to_assume }}
          role-duration-seconds: 900

      - name: Add the Spacelift Helm registry
        run: helm repo add spacelift s3://${{ secrets.aws_s3_bucket }}/helm

      - name: Set chart version number
        id: version
        env:
          STRATEGY: ${{ inputs.chart_version_strategy }}
          PREFIX: ${{ inputs.chart_version_prefix }}
        run: |
          if [[ "$STRATEGY" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${PREFIX}.$(date +'%s')"
          fi
          echo "CHART_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: helm package --version "$CHART_VERSION" --destination build/chart "$CHART/"

      - name: Push chart to S3
        run: helm s3 push --force --relative "build/chart/${CHART}-${CHART_VERSION}.tgz" spacelift

      - name: Publish chart to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.r2_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.r2_secret_access_key }}
          AWS_SESSION_TOKEN: ""
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_BUCKET: ${{ inputs.r2_bucket }}
          R2_ENDPOINT: ${{ inputs.r2_endpoint }}
        # helm-s3 is incompatible with R2: the plugin unconditionally sets
        # `x-amz-acl`, which R2 rejects with 501 NotImplemented for any value
        # (per the R2 S3 API compatibility doc — `x-amz-acl` is in the
        # unimplemented list for PutObject).
        run: |
          set -euo pipefail

          put() {
            aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "$1" \
              --body "$2" \
              --endpoint-url "$R2_ENDPOINT" >/dev/null
          }

          TGZ="${CHART}-${CHART_VERSION}.tgz"
          STAGE=$(mktemp -d)
          cp "build/chart/$TGZ" "$STAGE/"

          # The index is shared with the charts in spacelift-helm-charts, so
          # always merge into it. Never fall back to a fresh index: that would
          # drop every other chart from the repository.
          aws s3api get-object \
            --bucket "$R2_BUCKET" \
            --key helm/index.yaml \
            --endpoint-url "$R2_ENDPOINT" \
            "$STAGE/previous-index.yaml" >/dev/null
          helm repo index --merge "$STAGE/previous-index.yaml" "$STAGE"
          rm -f "$STAGE/previous-index.yaml"

          put "helm/$TGZ" "$STAGE/$TGZ"

          # Upload the index last so consumers see a consistent state.
          put "helm/index.yaml" "$STAGE/index.yaml"

      - name: Purge Cloudflare cache
        uses: spacelift-io/public-shared-actions/actions/purge-cloudflare-cache@main
        with:
          zone_id: ${{ inputs.cloudflare_zone_id }}
          api_token: ${{ secrets.cloudflare_purge_token }}
          purge_prefixes: ${{ inputs.cloudflare_purge_prefix }}

      - name: Invalidate cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id ${{ secrets.cf_distribution_id }}
          --paths "/helm/*"

  test-new-version:
    name: Test that the new chart version can be pulled
    runs-on: ubuntu-latest
    needs: [registry]

    steps:
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Pull chart
        env:
          REPO_URL: ${{ inputs.smoke_pull_repo_url }}
          CHART_VERSION: ${{ needs.registry.outputs.chart_version }}
        run: |
          set -euo pipefail
          helm repo add spacelift "$REPO_URL"
          helm repo update
          helm pull "spacelift/$CHART" --version "$CHART_VERSION"
