# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: workload deployment settings
templates:
  - deploy/server/deployment.yaml
  - deploy/drain/deployment.yaml
  - deploy/vcs-gateway/deployment.yaml
set:
  shared.launcherImage.enabled: true
  vcsGateway.enabled: true
  vcsGateway.domain: vcs-gateway.example.com
tests:
  - it: renders 3 drain replicas by default
    template: deploy/drain/deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: sets the drain replicas
    template: deploy/drain/deployment.yaml
    set:
      drain.replicaCount: 5
    asserts:
      - equal:
          path: spec.replicas
          value: 5

  - it: keeps a drain replicaCount of 0
    template: deploy/drain/deployment.yaml
    set:
      drain.replicaCount: 0
    asserts:
      - equal:
          path: spec.replicas
          value: 0

  - it: leaves the drain replicas out when replicaCount is null
    template: deploy/drain/deployment.yaml
    set:
      drain.replicaCount: null
    asserts:
      - notExists:
          path: spec.replicas

  - it: keeps the rolling update strategy on the server and VCS Gateway by default
    asserts:
      - template: deploy/server/deployment.yaml
        equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 90%
      - template: deploy/vcs-gateway/deployment.yaml
        equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 90%

  - it: leaves the strategy to Kubernetes on the drain by default
    asserts:
      - template: deploy/drain/deployment.yaml
        notExists:
          path: spec.strategy

  - it: sets a custom strategy on every workload
    set:
      server.strategy:
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      drain.strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: "50%"
          maxUnavailable: "25%"
      vcsGateway.strategy:
        rollingUpdate:
          maxUnavailable: 1
    asserts:
      - template: deploy/server/deployment.yaml
        equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
      - template: deploy/drain/deployment.yaml
        equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 50%
              maxUnavailable: 25%
      - template: deploy/vcs-gateway/deployment.yaml
        equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1

  - it: renders only type Recreate when rollingUpdate is set to null
    set:
      server.strategy:
        type: Recreate
        rollingUpdate: null
      vcsGateway.strategy:
        type: Recreate
        rollingUpdate: null
    asserts:
      - template: deploy/server/deployment.yaml
        equal:
          path: spec.strategy
          value:
            type: Recreate
      - template: deploy/vcs-gateway/deployment.yaml
        equal:
          path: spec.strategy
          value:
            type: Recreate

  - it: leaves the strategy to Kubernetes when strategy is null
    set:
      server.strategy: null
      vcsGateway.strategy: null
    asserts:
      - template: deploy/server/deployment.yaml
        notExists:
          path: spec.strategy
      - template: deploy/vcs-gateway/deployment.yaml
        notExists:
          path: spec.strategy

  - it: rejects type Recreate on the server while the default rollingUpdate is merged in
    template: deploy/server/deployment.yaml
    set:
      server.strategy.type: Recreate
    asserts:
      - failedTemplate:
          errorPattern: "/server/strategy/rollingUpdate': got object, want null"

  - it: rejects type Recreate together with a rollingUpdate on the drain
    template: deploy/drain/deployment.yaml
    set:
      drain.strategy:
        type: Recreate
        rollingUpdate:
          maxSurge: 1
    asserts:
      - failedTemplate:
          errorPattern: "/drain/strategy/rollingUpdate': got object, want null"

  - it: rejects an unknown strategy type
    template: deploy/server/deployment.yaml
    set:
      server.strategy.type: BlueGreen
    asserts:
      - failedTemplate:
          errorPattern: "/server/strategy/type"

  - it: rejects an unknown rollingUpdate field
    template: deploy/drain/deployment.yaml
    set:
      drain.strategy.rollingUpdate.maxSurged: 1
    asserts:
      - failedTemplate:
          errorPattern: "/drain/strategy/rollingUpdate"

  - it: sets deployment annotations on every workload
    set:
      server.deploymentAnnotations:
        secret.reloader.stakater.com/reload: server-secret
      drain.deploymentAnnotations:
        secret.reloader.stakater.com/reload: drain-secret
      vcsGateway.deploymentAnnotations:
        secret.reloader.stakater.com/reload: vcs-gateway-secret
    asserts:
      - template: deploy/server/deployment.yaml
        equal:
          path: metadata.annotations
          value:
            secret.reloader.stakater.com/reload: server-secret
      - template: deploy/drain/deployment.yaml
        equal:
          path: metadata.annotations
          value:
            secret.reloader.stakater.com/reload: drain-secret
      - template: deploy/vcs-gateway/deployment.yaml
        equal:
          path: metadata.annotations
          value:
            secret.reloader.stakater.com/reload: vcs-gateway-secret

  - it: sets no deployment annotations by default
    asserts:
      - notExists:
          path: metadata.annotations

  - it: keeps deployment annotations out of the pod template
    set:
      server.deploymentAnnotations:
        example.com/deployment: "true"
      drain.deploymentAnnotations:
        example.com/deployment: "true"
      vcsGateway.deploymentAnnotations:
        example.com/deployment: "true"
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: keeps deployment and pod annotations apart
    template: deploy/server/deployment.yaml
    set:
      server.deploymentAnnotations:
        example.com/deployment: "true"
      server.podAnnotations:
        example.com/pod: "true"
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/deployment: "true"
      - equal:
          path: spec.template.metadata.annotations
          value:
            example.com/pod: "true"

  - it: rejects deployment annotations with a non-string value
    template: deploy/server/deployment.yaml
    set:
      server.deploymentAnnotations:
        example.com/count: 1
    asserts:
      - failedTemplate:
          errorPattern: "/server/deploymentAnnotations/example.com~1count"
