name: ✅ Auto-approve

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  auto-approve:
    name: Auto-approve Renovate PR
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'spacelift-sh-helm-chart-app[bot]' &&
      github.event.sender.login == 'spacelift-sh-helm-chart-app[bot]'
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SELFHOSTED_CHART_DEPENDENCY_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.SELFHOSTED_CHART_DEPENDENCY_AUTOMATION_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Approve
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$(gh pr view "$PR_URL" --json reviewDecision --jq .reviewDecision)" = "APPROVED" ]; then
            echo "PR is already approved, skipping"
            exit 0
          fi

          gh pr review "$PR_URL" --approve
