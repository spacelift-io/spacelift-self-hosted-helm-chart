{{- if and .Values.flows.enabled .Values.flows.ingress.enabled -}}
{{- $domain := required "flows.domain is required when flows.ingress.enabled is true" .Values.flows.domain -}}
{{- $server := printf "%s-flows-server" (include "spacelift.fullname" .) -}}
{{- $serverHosts := list $domain (printf "*.endpoints.%s" $domain) (printf "mcp.%s" $domain) (printf "oauth.%s" $domain) -}}
{{- $gatewayHost := printf "gateway.%s" $domain -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "spacelift.fullname" . }}-flows
  labels:
    {{- include "spacelift.flowsLabels" . | nindent 4 }}
  {{- with .Values.flows.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.flows.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        {{- range $serverHosts }}
        - {{ . | quote }}
        {{- end }}
        {{- if .Values.flows.ingress.exposeGateway }}
        - {{ $gatewayHost | quote }}
        {{- end }}
      {{- with .Values.flows.ingress.tlsSecretName }}
      secretName: {{ . | quote }}
      {{- end }}
  rules:
    {{- range $serverHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $server }}
                port:
                  name: public
    {{- end }}
    {{- if .Values.flows.ingress.exposeGateway }}
    - host: {{ $gatewayHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "spacelift.fullname" . }}-flows-gateway
                port:
                  name: public
    {{- end }}
{{- end }}
